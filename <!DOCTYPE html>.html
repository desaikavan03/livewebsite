
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I'm Sorry ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at center, #4a0712 0%, #180208 45%, #050104 100%);
      font-family: Georgia, serif;
      color: white;
    }

    /* Background glow */
    body::before {
      content: "";
      position: fixed;
      width: 350px;
      height: 350px;
      background: #9b102d;
      filter: blur(140px);
      opacity: 0.25;
      border-radius: 50%;
    }

    .card {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 430px;
      text-align: center;
      padding: 50px 30px;

      background: rgba(25, 2, 8, 0.7);
      border: 1px solid rgba(255, 50, 80, 0.25);
      border-radius: 28px;

      box-shadow: 0 0 50px rgba(255, 0, 50, 0.15);
      backdrop-filter: blur(15px);

      animation: fadeIn 1.2s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .heart {
      font-size: 50px;
      margin-bottom: 18px;
      animation: beat 1.3s infinite;
      display: inline-block;
    }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.18); }
    }

    h1 {
      font-size: 58px;
      font-weight: normal;
      color: #fff;
      margin-bottom: 15px;
      text-shadow: 0 0 20px rgba(255, 20, 60, 0.5);
    }

    h1 span {
      color: #ff3158;
      font-style: italic;
    }

    .text {
      color: #d9aeb8;
      font-family: Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 0.5px;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    button {
      border: none;
      padding: 14px 28px;
      border-radius: 50px;
      background: linear-gradient(135deg, #ff1744, #8e0926);
      color: white;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(255, 0, 50, 0.25);
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .message {
      margin-top: 25px;
      font-size: 18px;
      color: #ff8da4;
      opacity: 0;
      transform: translateY(10px);
      transition: 0.6s ease;
      pointer-events: none;
    }

    .message.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Floating hearts */
    .floating-heart {
      position: absolute;
      bottom: -30px;
      color: #ff1744;
      opacity: 0;
      animation: float linear forwards;
      pointer-events: none;
    }

    @keyframes float {
      0% {
        opacity: 0;
        transform: translateY(0) scale(0.7);
      }
      15% {
        opacity: 0.7;
      }
      100% {
        opacity: 0;
        transform: translateY(-110vh) scale(1.3);
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="heart">❤️</div>

    <h1>I'm <span>Sorry</span></h1>

   

    <button onclick="saySorry()">
      Open ❤️
    </button>

    <div class="message" id="message">
      I love you. I'm sorry. 🥺❤️
    </div>

  </div>

  <script>
    function saySorry() {
      const message = document.getElementById("message");
      message.classList.add("show");

      for (let i = 0; i < 20; i++) {
        createHeart();
      }
    }

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "floating-heart";
      heart.innerHTML = Math.random() > 0.5 ? "♥" : "❤";

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (12 + Math.random() * 20) + "px";
      heart.style.animationDuration = (3 + Math.random() * 4) + "s";

      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 7000);
    }

    setInterval(createHeart, 800);
  </script>

</body>
</html>
